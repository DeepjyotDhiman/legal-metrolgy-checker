version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinetra_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=sqlite:////app/data/trinetra.db
      - UPLOAD_DIR=/app/data/uploads
      - SECRET_KEY=trinetra_sih_2026_super_secret_key_change_in_production_min_32_chars
      - COOKIE_SECURE=False
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
